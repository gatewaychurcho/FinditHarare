<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0066FF" />
  <title>Findit Harare — Your Price. Your Pro. At Your Door.</title>
  <link rel="manifest" href="manifest.json" />
  <!-- Inter & Plus Jakarta Sans Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <!-- Leaflet Map CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="styles.css?v=3.1.0" />
</head>
<body>
  <div id="appViewport" class="app-viewport">
    <!-- Clean Authentic Brand Splash Screen (No AI / Hyper Fake Graphics) -->
    <div id="splashScreen" class="splash-screen">
      <div class="splash-content">
        <div class="splash-brand-mark">
          <span class="splash-findit-txt">Findit</span>
          <span class="splash-harare-txt">Harare</span>
        </div>

        <div class="splash-catchphrase">
          Your Price • Your Pro • At Your Door
        </div>

        <div class="splash-loader-track">
          <div class="splash-loader-fill" id="splashLoaderFill"></div>
        </div>
      </div>
    </div>

    <!-- WhatsApp Push Notification Banner for 4-Digit OTP Code -->
    <div id="whatsappBannerRoot"></div>

    <!-- Full-Screen Harare Street Map (OpenStreetMap Free Tiles — No API Key Required) -->
    <div id="harareMapContainer" class="map-layer">
      <div id="leafletMap" class="leaflet-map"></div>
      <div id="fallbackRadarMap" class="fallback-radar-map"></div>

      <!-- Center User Hailing Pin + Blue Radar Circles (inDrive Style: Move Map to Any Location & Order Services There) -->
      <div id="centerMapPin" class="center-map-pin" style="display:flex;">
        <!-- Concentric Blue Radar Circles when Searching -->
        <div id="mapRadarPulses" class="map-radar-pulses" style="display:none;">
          <div class="radar-circle-outer"></div>
          <div class="radar-circle-inner"></div>
        </div>

        <!-- Home Visit Location Callout Bubble -->
        <div class="indrive-where-from-bubble" id="whereFromBubble" onclick="handleCenterPinBubbleClick()">
          <div class="where-from-sub">Drag map to move • Tap to change</div>
          <div class="where-from-row">
            <span id="centerPinLabel">Avondale, Harare</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
          </div>
          <div id="whereFromOrderAction" class="where-from-order-pill" onclick="event.stopPropagation(); orderFromCurrentMapPin();">
            <span>Order service here</span>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          </div>
        </div>

        <!-- Electric Blue & White User Hailing Pin on Stem -->
        <div class="indrive-waving-pin-box" id="centerUserPinBox" onclick="orderFromCurrentMapPin()">
          <div class="user-pin-pulse-ring"></div>
          <img id="centerPinUserAvatar" src="" alt="You" style="display:none; width:100%; height:100%; object-fit:cover; border-radius:11px;" />
          <svg id="centerPinDefaultSvg" width="24" height="24" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="5" r="2.6" fill="#FFFFFF"/>
            <path d="M6.5 4.5C6.5 8.5 9 11 12 11.5L14.5 19.5M9.5 11.2L7.5 19.5M12 11.5L17.5 13.5" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <div class="user-pin-you-badge">YOU</div>
        </div>
        <div class="indrive-pin-stem"></div>
        <div class="indrive-pin-anchor-dot"></div>
      </div>
    </div>

    <!-- "Choose a pro" Incoming Offer Cards Overlay (with 120s Shrinking Accept Button) -->
    <div id="floatingOffersRoot" class="floating-offers-root"></div>

    <!-- Main UI Overlay (Top Bar with Sign Up Button & Bottom Sheet) -->
    <div id="uiOverlay" class="ui-overlay"></div>
  </div>

  <!-- Bottom Sheet Modals & Slide-Out Left Drawer -->
  <div id="pickerModalRoot"></div>

  <!-- Guarded Quick-Message Chat Drawer -->
  <div id="chatDrawerRoot"></div>

  <!-- Masked In-App Voice Call Modal -->
  <div id="callModalRoot"></div>

  <!-- Toast Notifications -->
  <div class="toast-container" id="toastContainer"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://download.agora.io/sdk/release/AgoraRTC_N-4.20.0.js"></script>
  <script src="app.js?v=3.1.0"></script>
</body>
</html>
