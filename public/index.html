<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0066FF" />
  <title>Findit Harare — Your Price. Your Pro. At Your Door.</title>
  <link rel="manifest" href="manifest.json" />
  <!-- Inter & Plus Jakarta Sans Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <!-- Leaflet Map CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="styles.css?v=2.3.1" />
</head>
<body>
  <div id="appViewport" class="app-viewport">
    <!-- Pure Vector SVG & Code Animated Splash Screen (Zero Raw Photos) -->
    <div id="splashScreen" class="fh-splash-overlay">
      <div class="fh-splash-backdrop-mesh"></div>
      
      <div class="fh-splash-stage">
        <!-- Concentric Pulsing Radar Sonar Rings -->
        <div class="fh-splash-sonar-box">
          <div class="fh-sonar-pulse fh-sonar-pulse-1"></div>
          <div class="fh-sonar-pulse fh-sonar-pulse-2"></div>
          <div class="fh-sonar-pulse fh-sonar-pulse-3"></div>

          <!-- Luminous Orbital Satellite Ring -->
          <div class="fh-orbital-track">
            <div class="fh-orbital-satellite"></div>
          </div>

          <!-- Handcrafted Pure Vector SVG Shield & Beacon Emblem -->
          <div class="fh-emblem-svg-wrap">
            <svg class="fh-emblem-svg" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <linearGradient id="fhEmblemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#00D2FF"/>
                  <stop offset="50%" stop-color="#0066FF"/>
                  <stop offset="100%" stop-color="#0B1B3D"/>
                </linearGradient>
                <linearGradient id="fhPinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#38BDF8"/>
                  <stop offset="100%" stop-color="#0066FF"/>
                </linearGradient>
                <filter id="fhNeonGlow" x="-20%" y="-20%" width="140%" height="140%">
                  <feGaussianBlur stdDeviation="3.5" result="blur"/>
                  <feComposite in="SourceGraphic" in2="blur" operator="over"/>
                </filter>
              </defs>
              
              <!-- Outer Hexagonal Beacon Shield -->
              <path class="fh-emblem-shield-outline" d="M60 10 L98 28 V64 C98 86 60 108 60 108 C60 108 22 86 22 64 V28 L60 10Z" stroke="url(#fhEmblemGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="rgba(11, 27, 61, 0.6)" filter="url(#fhNeonGlow)"/>

              <!-- Stylized Harare Beacon Pin -->
              <circle cx="60" cy="46" r="14" fill="url(#fhPinGrad)"/>
              <path d="M60 46 L60 76" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round"/>
              <circle cx="60" cy="46" r="6" fill="#FFFFFF"/>
              
              <!-- Stylized Monogram F / Lightning Accent -->
              <path class="fh-emblem-lightning" d="M54 38 H66 L60 48 H66 L52 64 L56 52 H49 L54 38Z" fill="#FFFFFF"/>

              <!-- Satellite Accents -->
              <circle cx="60" cy="10" r="3" fill="#00D2FF"/>
              <circle cx="98" cy="28" r="2.5" fill="#38BDF8"/>
              <circle cx="22" cy="28" r="2.5" fill="#38BDF8"/>
            </svg>
          </div>
        </div>

        <!-- High-Impact Brand Typography -->
        <div class="fh-splash-brand-title">
          <span>FINDIT</span> <span class="fh-brand-gradient-text">HARARE</span>
        </div>

        <div class="fh-splash-tagline-badge">
          <span>HARARE'S DIRECT SERVICES HUB</span>
        </div>

        <!-- Fluid Animated Loading Stage Label -->
        <div class="fh-splash-status-label" id="splashStatusText">
          Connecting to Harare Pro Network...
        </div>

        <!-- Glowing Neon Progress Track -->
        <div class="fh-splash-progress-track">
          <div class="fh-splash-progress-fill" id="splashLoaderFill"></div>
        </div>

        <div class="fh-splash-bottom-bullets">
          <span>Direct Pricing</span> • <span>Verified Pros</span> • <span>Zero Middlemen</span>
        </div>
      </div>
    </div>

    <!-- WhatsApp Push Notification Banner for 4-Digit OTP Code -->
    <div id="whatsappBannerRoot"></div>

    <!-- Full-Screen Harare Street Map (OpenStreetMap Free Tiles — No API Key Required) -->
    <div id="harareMapContainer" class="map-layer">
      <div id="leafletMap" class="leaflet-map"></div>
      <div id="fallbackRadarMap" class="fallback-radar-map"></div>

      <!-- Center Home Location Pin + Blue Radar Circles -->
      <div id="centerMapPin" class="center-map-pin" style="display:none;">
        <!-- Concentric Blue Radar Circles when Searching -->
        <div id="mapRadarPulses" class="map-radar-pulses" style="display:none;">
          <div class="radar-circle-outer"></div>
          <div class="radar-circle-inner"></div>
        </div>

        <!-- Home Visit Location Callout Bubble -->
        <div class="indrive-where-from-bubble" id="whereFromBubble" onclick="openSuburbPickerModal()">
          <div class="where-from-sub">Your home location</div>
          <div class="where-from-row">
            <span id="centerPinLabel">Avondale, Harare</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
          </div>
        </div>

        <!-- Electric Blue & White Home Visit Pin on Stem -->
        <div class="indrive-waving-pin-box">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <circle cx="13.5" cy="5.5" r="2.4" fill="#FFFFFF"/>
            <path d="M7 4.5C7 8.5 9.5 11 13 11.5L15.5 19.5M10 11.2L8 19.5M13 11.5L18 14" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="indrive-pin-stem"></div>
        <div class="indrive-pin-anchor-dot"></div>
      </div>
    </div>

    <!-- "Choose a pro" Incoming Offer Cards Overlay (with 120s Shrinking Accept Button) -->
    <div id="floatingOffersRoot" class="floating-offers-root"></div>

    <!-- Main UI Overlay (Top Bar with Sign Up Button & Bottom Sheet) -->
    <div id="uiOverlay" class="ui-overlay"></div>
  </div>

  <!-- Bottom Sheet Modals & Slide-Out Left Drawer -->
  <div id="pickerModalRoot"></div>

  <!-- Guarded Quick-Message Chat Drawer -->
  <div id="chatDrawerRoot"></div>

  <!-- Masked In-App Voice Call Modal -->
  <div id="callModalRoot"></div>

  <!-- Toast Notifications -->
  <div class="toast-container" id="toastContainer"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://download.agora.io/sdk/release/AgoraRTC_N-4.20.0.js"></script>
  <script src="app.js?v=2.3.0"></script>
</body>
</html>
