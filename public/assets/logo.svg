<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 76" width="340" height="76">
  <defs>
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#0047BA" />
    </linearGradient>
    <filter id="logoShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0047BA" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Logo Mark Icon (Squircle) -->
  <g transform="translate(4, 8)">
    <rect x="0" y="0" width="60" height="60" rx="16" fill="url(#logoBg)" filter="url(#logoShadow)" />
    <!-- Dynamic Corner Node -->
    <circle cx="48" cy="12" r="4.5" fill="#38BDF8" />
    <!-- Stylized "f" + Pin -->
    <path d="M 27 15 C 27 10 32 6 38 6 C 44 6 47 9 47 14 L 41 14 C 41 12 39 10 37 10 C 34 10 32 12 32 15 L 32 20 L 44 20 C 46 20 47 21.5 47 23 C 47 24.5 46 26 44 26 L 32 26 L 32 46 C 32 48 30.5 49 29 49 C 27.5 49 26 48 26 46 L 26 26 L 19 26 C 17.5 26 16 24.5 16 23 C 16 21.5 17.5 20 19 20 L 26 20 L 26 15 Z" fill="#FFFFFF" />
    <!-- Radar Pin Node -->
    <circle cx="16" cy="38" r="4" fill="#38BDF8" stroke="#FFFFFF" stroke-width="2" />
  </g>

  <!-- Wordmark: findit -->
  <g transform="translate(78, 48)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="36" letter-spacing="-0.04em">
      <tspan fill="#0F172A">find</tspan><tspan fill="#0066FF">it</tspan>
    </text>
  </g>

  <!-- Harare Subtitle Pill -->
  <g transform="translate(225, 26)">
    <rect x="0" y="0" width="84" height="24" rx="12" fill="#EBF3FF" />
    <text x="42" y="16.5" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="11" fill="#0066FF" letter-spacing="0.1em" text-anchor="middle">HARARE</text>
  </g>
</svg>
